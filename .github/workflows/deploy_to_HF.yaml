name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ]   # adjust if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up Python (for hf cli)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo, upload_folder

          HF_TOKEN = os.environ["HF_TOKEN"]

          # CHANGE THIS to your HF username/org and Space name:
          SPACE_ID = "SSNitinY/TempsBot_core"  # e.g., "ssnitiny/TempsBot"
          REPO_TYPE = "space"

          api = HfApi(token=HF_TOKEN)

          # Ensure Space exists; set SDK=docker
          try:
              create_repo(
                  name=SPACE_ID.split("/")[1],
                  token=HF_TOKEN,
                  repo_type=REPO_TYPE,
                  space_sdk="docker",
                  exist_ok=True,
                  private=False   # set True if you want private Space
              )
          except Exception as e:
              print("create_repo note:", e)

          # Upload files required to run the Docker Space
          upload_folder(
              repo_id=SPACE_ID,
              repo_type=REPO_TYPE,
              folder_path=".",
              path_in_repo=".",
              allow_patterns=[
                "app.py",
                "Dockerfile",
                "requirements.txt",
                ".streamlit/**",
                "color_utils.py",
                "export_utils.py",
                "forecast_api.py",
                "gpt_summarizer.py",
                "outfit_forecast.py",
                "sunscreen_advisor.py",
                "summarizer.py",
                "wardrobe_advisor.py",
                "weather_api.py",
                "p_environment.txt",
              ],
          )
          print("Uploaded to Space:", SPACE_ID)
          PY
