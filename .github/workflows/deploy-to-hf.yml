name: Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]   # change if your default branch is different
  workflow_dispatch:      # allow manual runs from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python (optional, not required to push)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

      - name: TempsBot_Private
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          # Use token-based remote URL
          git remote add hf https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git
          git push hf HEAD:main --force
